name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PDF_NAME: Tom-Dobson-CV

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install TeX Live
        uses: zauguin/install-texlive@6671d0c62046c7e349fe154d5208fe746b07e037 # v4.4.0
        with:
          texlive_version: 2023
          repository: https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2023/tlnet-final
          package_file: .github/texlive-packages.txt
      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build and check the PDF
        run: make check
      - name: Upload the PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PDF_NAME }}
          path: build/${{ env.PDF_NAME }}.pdf
          if-no-files-found: error
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install latexindent
        run: |
          curl -fsSL -o latexindent \
            https://github.com/cmhughes/latexindent.pl/releases/latest/download/latexindent-linux
          sudo install -m 755 latexindent /usr/local/bin/latexindent
      - name: Run Prettier, ShellCheck, and latexindent
        run: make lint

  release:
    name: Release
    permissions:
      contents: write
    needs: [build, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the PDF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PDF_NAME }}
      - name: Publish the release
        run: |
          # GitHub prints the tag beside the title, so the title carries the date without repeating it.
          title=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" "$PDF_NAME.pdf" \
            --title "${title//./-}" --verify-tag --generate-notes
